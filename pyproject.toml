[project]
name = "wb-alert-bot"
version = "0.1.0"
description = "Telegram bot for Ozon and Wildberries price monitoring and alerts"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "aiogram==3.26.0",
    "aiosqlite>=0.22",
    "alembic>=1.18.4",
    "curl_cffi==0.16.3",
    "fastapi==0.135.1",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "playwright==1.64.0",
    "pydantic>=2.12.5",
    "pydantic-settings==2.13.1",
    "redis>=7.3.0",
    "sqlalchemy==2.0.48",
    "uvicorn==0.42.0",
]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.7",
]


[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "SIM",
    "ASYNC",
    "T20",
    "DTZ"
]

ignore = ["UP037"]

[tool.ruff.lint.isort]
force-single-line = true


[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_untyped_fields = true

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
strict_markers = true
strict_config = true
filterwarnings = ["error::pytest.PytestConfigWarning"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "@(abc\\.)?abstractmethod",
]

# Layer boundaries, see PROJECT.md §4 "Механическая проверка границ".
# Contract composition is an architect decision; new client/service modules
# are added by the ticket that creates them.
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "L1: layer order"
type = "layers"
layers = [
    "app.main",
    "app.scheduler",
    "app.handlers : app.bot",
    "app.services",
    "app.repositories",
    "app.models",
]

[[tool.importlinter.contracts]]
name = "L2: bot and handlers do not reach repositories directly"
type = "forbidden"
source_modules = [
    "app.bot",
    "app.handlers",
]
forbidden_modules = [
    "app.repositories",
]
# The legitimate app.handlers -> app.services -> app.repositories path is an
# indirect import and must not break this contract; only a *direct* import of
# app.repositories from app.bot/app.handlers is forbidden (PAB-065, попытка 2).
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "L3: marketplace clients do not know about persistence or application services"
type = "forbidden"
source_modules = [
    "app.services.base_client",
    "app.services.wb_client",
    "app.services.ozon_client",
    "app.services.client_factory",
    "app.services.wb_access",
    "app.services.wb_browser",
    "app.services.browser_launch",
    "app.services.ozon_access",
    "app.services.ozon_browser",
    "app.services.socks_relay",
]
forbidden_modules = [
    "app.repositories",
    "app.models",
    "app.core.database",
    "sqlalchemy",
    "app.services.price_service",
    "app.services.notification",
    "app.services.tracking",
]
ignore_imports = [
    "app.services.client_factory -> app.models.enums",
]

[[tool.importlinter.contracts]]
name = "L4: schemas and domain stay free of infrastructure"
type = "forbidden"
source_modules = [
    "app.schemas",
    "app.domain",
]
forbidden_modules = [
    "app.main",
    "app.scheduler",
    "app.bot",
    "app.handlers",
    "app.services",
    "app.repositories",
    "app.core",
    "sqlalchemy",
    "httpx",
    "aiogram",
]

[[tool.importlinter.contracts]]
name = "L5: core is a foundation, not a consumer of upper layers"
type = "forbidden"
source_modules = [
    "app.core",
]
forbidden_modules = [
    "app.main",
    "app.scheduler",
    "app.bot",
    "app.handlers",
    "app.services",
    "app.repositories",
]

[[tool.importlinter.contracts]]
name = "L6: playwright is imported only by the browser modules"
type = "protected"
protected_modules = [
    "playwright",
]
allowed_importers = [
    "app.services.wb_browser",
    "app.services.ozon_browser",
    "app.services.browser_launch",
]

[[tool.importlinter.contracts]]
name = "L7: curl_cffi is imported only by the Ozon client"
type = "protected"
protected_modules = [
    "curl_cffi",
]
allowed_importers = [
    "app.services.ozon_client",
]
