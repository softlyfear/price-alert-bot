name = "tests-agent"
description = "Слой тестирования price-alert-bot. Владеет tests/ (настройки pytest в pyproject.toml — у devops-agent). Пишет unit-тесты на моках и интеграционные тесты на файловой SQLite, обеспечивает 100% покрытие кода тикета. Вызывать явно по имени последним звеном цепочки исполнителей тикета или когда тикет адресован тестам."
