# Production-like stack: PostgreSQL + Redis + one-shot migrations + the bot.
#
# Start and update ONLY with `make docker-up` (build -> stop app -> up -d):
# a bare `docker compose up -d` re-runs the finished `migrate` service on every
# call, even while `app` is running, and migrations must not run under a live bot.
#
# Environment: one file outside git, `.env` in the repo root by default,
# another path via `make docker-up ENV_FILE=/path/to/file`. The same file is
# used for interpolation (`--env-file`) and as `env_file` of app and migrate.
# Variables the stack needs from it: DB__USER, DB__PASSWORD, DB__NAME (required
# here), plus everything the application settings require (see .env.example).
# No secret value lives in this file.
#
# Limits:
# - compose and pydantic-settings parse values with `$`, `#`, quotes and spaces
#   differently; keep secrets within [A-Za-z0-9_-] or verify them by a run.
# - `docker compose config` and `docker inspect` print environment values:
#   treat their output as a secret.
# - Redis has no password and no published port: it is reachable only inside the
#   project network (do not set REDIS__PASSWORD for this stack).
# - The healthcheck of app is observational: Docker does not restart an `unhealthy`
#   container. A dead polling task or scheduler makes the process exit by itself and
#   `restart: unless-stopped` brings it back; a hang without a dead task is not covered
#   (/health stays 200 while the work stands).
# - No service publishes a port. If an API or admin UI appears, publish it on
#   127.0.0.1 only.
# - One replica of app (no deploy/scale): polling and scheduler are single-instance.

name: price-alert-bot

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB__USER:?DB__USER is required in the environment file}
      POSTGRES_PASSWORD: ${DB__PASSWORD:?DB__PASSWORD is required in the environment file}
      POSTGRES_DB: ${DB__NAME:?DB__NAME is required in the environment file}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # TCP (-h 127.0.0.1), not the unix socket: the temporary first-initialization
      # server of the image listens on the socket only, and a socket probe reports
      # "ready" while the real server is not up yet.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging

  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    volumes:
      # Default RDB snapshots land in /data: FSM states survive down/up.
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    logging: *default-logging

  # One-shot: brings the schema to head, then exits. app starts only after exit code 0.
  migrate:
    image: price-alert-bot
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    env_file: ${ENV_FILE:-.env}
    environment:
      DB__HOST: postgres
      DB__PORT: "5432"
      REDIS__HOST: redis
      REDIS__PORT: "6379"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy

  app:
    image: price-alert-bot
    build:
      context: .
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      DB__HOST: postgres
      DB__PORT: "5432"
      REDIS__HOST: redis
      REDIS__PORT: "6379"
      # Security invariant of this stack, not an operator choice: the token is
      # fetched by Chromium that runs third-party JavaScript, and it must run
      # inside its own sandbox. If the sandbox cannot start, the fetch fails with
      # detail `sandbox_unavailable` instead of running without it.
      WB__BROWSER_SANDBOX: "true"
      # Same invariant for the Ozon cookie fetch (same Chromium, same reason).
      OZON__BROWSER_SANDBOX: "true"
      # Chromium writes its profile and caches under HOME / XDG_*; the root
      # filesystem is read-only, so they point into the /tmp tmpfs.
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
      XDG_CONFIG_HOME: /tmp/.config
    read_only: true
    # Chromium spawns processes; without an init a crashed one stays a zombie of PID 1.
    init: true
    # tmpfs counts against mem_limit, so its size is a cap on what Chromium may take
    # from the memory budget. Playwright starts Chromium with --disable-dev-shm-usage
    # (confirmed in the process command line inside this container), so Chromium
    # shared memory goes to /tmp, not /dev/shm. D5 (five live fetches of
    # wildberries.ru): maximum /tmp use 1.36 MiB (1425408 B); 64m is ~47x that.
    tmpfs:
      - /tmp:size=64m
    # /dev/shm is NOT used by Chromium while --disable-dev-shm-usage stays (D5: 0
    # bytes at 50 ms sampling in all five live fetches). 128m is only insurance for
    # the case that flag disappears in a Playwright update (Docker default is 64m,
    # the Playwright docs advise raising it); it counts against mem_limit only
    # while used. `ipc: host` is not used.
    shm_size: 128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      # Docker's default profile (moby/profiles seccomp v0.1.0, the version built into
      # Engine 29.1.3) forbids creating user namespaces without CAP_SYS_ADMIN: the
      # Chromium sandbox does not start (measured: detail `sandbox_unavailable`).
      # docker/seccomp-chromium.json = that profile + a delta: chroot, and clone and
      # unshare with a flag mask (like the default clone rule) that lets only
      # CLONE_NEWUSER, CLONE_NEWPID and CLONE_NEWNET through; CLONE_NEWNS, NEWUTS,
      # NEWIPC, NEWCGROUP and (unshare only) NEWTIME stay denied (measured: EPERM).
      # For clone, bit 0x80 is CSIGNAL, not CLONE_NEWTIME: clone cannot create a
      # time namespace; clone3 (which could) stays ENOSYS.
      # It is NOT guarded against drift from the default profile; trigger to
      # re-derive it: a Docker Engine update on the server.
      # Residual risk: ANY process of app (not only Chromium) can create user and
      # network namespaces, which widens the kernel attack surface of the container.
      # Why accepted: the Chromium sandbox is built on namespaces; the setuid
      # sandbox cannot work with no-new-privileges; running without the sandbox is
      # forbidden (WB__BROWSER_SANDBOX above). Alternative: a separate browser
      # container (TASKS.md, section K, question 3). Revisit when Docker Engine on
      # the server is updated.
      - seccomp=./docker/seccomp-chromium.json
    # Memory limit (PAB-080 AC7, revised in PAB-110 AC14 (v)): (peak + app working
    # memory + WB batch reserve) x 1.25, rounded up to 64 MiB. memswap_limit =
    # mem_limit: no swap, so the limit is real and an overrun is an OOM kill, not a
    # slowdown.
    #   clean peak while obtaining Ozon access (PAB-110 AC14 (v)): memory.current
    #   214 -> 524 MiB, sampled every 50 ms:                          524 MiB
    #   app working memory (aiogram, SQLAlchemy, FastAPI, pools; not measured):
    #                                                            240 MiB (estimate)
    #   WB batch of 4 MiB body (measured: peak delta of 3 consecutive batches
    #   through WbClient against a stub, 4126814 B body):         10.3 MiB
    #   (524 + 240 + 10.3) x 1.25 = 967.9 MiB -> 1024 MiB.
    # Recompute if the browser, batch size or body cap changes.
    mem_limit: 1024m
    memswap_limit: 1024m
    # CPU: the target server has 2 cores shared with postgres, redis and the OS.
    # 1.5 leaves 0.5 core for them; Chromium startup is CPU-bound and gets the rest.
    cpus: 1.5
    # Shutdown budgets in app/main.py are sequential: 30 (in-flight updates)
    # + 45 (scheduler stop) + 5 (scheduler cancel) + 10 (WB token step: closing
    # the browser) + 10 (Ozon access step, close_ozon_access) = 100 s, plus 20 s
    # for steps without a budget = 120 s.
    # Recompute if a constant changes or the process tree changes.
    # `init` is on: with it the exit code of uvicorn on SIGTERM is 143, not 0;
    # `restart: unless-stopped` does not care.
    stop_grace_period: 120s
    healthcheck:
      # 200 only; 503 (polling or scheduler dead) raises and fails the check.
      # python:slim has no curl/wget, so the standard library does the request.
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      # Measured start to "Application startup complete" at cpus: 1.5 (three starts,
      # fake local Bot API answering getMe, no browser at start): 2.12, 2.37, 2.47 s.
      # start_period >= 3 x max (7.4 s) and not below 20 s: 20 s (~8x) for a slower
      # host or a real Telegram handshake. Failures inside it are not counted.
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    logging: *default-logging

volumes:
  pgdata:
  redisdata:
